<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rachael Craig</title>

    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.6;
        max-width: 680px;
        margin: 4rem auto;
        padding: 0 1rem;
        color: #111;
      }

      h1 {
        margin-bottom: 0.25rem;
      }

      h2 {
        margin-top: 2.5rem;
      }

      ul {
        padding-left: 1.2rem;
      }

      .socials {
        list-style: none;
        padding: 0;
        margin: 0.75rem 0 0;
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      .socials a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        color: #111;
        text-decoration: none;
        border: 1px solid rgba(0, 0, 0, 0.12);
        transition: transform 120ms ease, background-color 120ms ease,
          border-color 120ms ease;
      }

      .socials a:hover {
        transform: translateY(-1px);
        background-color: rgba(0, 0, 0, 0.04);
        border-color: rgba(0, 0, 0, 0.2);
      }

      .socials a:focus-visible {
        outline: 3px solid rgba(0, 0, 0, 0.25);
        outline-offset: 2px;
      }

      .socials svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      hr {
        margin: 3rem 0 1rem;
        border: 0;
        border-top: 1px solid rgba(0, 0, 0, 0.12);
      }

      small {
        color: #555;
      }
    </style>
  </head>

  <body>
    <h1>Rachael Craig</h1>
    <p>You found me.</p>

    <h2>Self-Mastery</h2>
